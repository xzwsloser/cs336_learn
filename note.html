<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>笔记 · CS336</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="back-link" href="./">← 返回列表</a>
    </div>
  </header>

  <main class="container note-page">
    <article id="note-content" class="markdown-body">
      <noscript>此页面需要 JavaScript 渲染 Markdown。</noscript>
    </article>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>CS336 Learning Notes · Powered by GitHub Pages</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>
  <script>
    var params = new URLSearchParams(window.location.search);
    var slug = params.get('p') || '';
    var container = document.getElementById('note-content');

    if (!slug || /[\/\\\.\.]/.test(slug)) {
      container.innerHTML = '<p>无效的笔记路径。</p>';
    } else {
    marked.setOptions({ gfm: true, breaks: false });

      fetch('notes/' + slug + '.md')
        .then(function(res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.text();
        })
        .then(function(md) {
          container.innerHTML = marked.parse(md);
          container.querySelectorAll('pre code').forEach(function(block) {
            hljs.highlightElement(block);
          });
          var h1 = container.querySelector('h1');
          if (h1) document.title = h1.textContent + ' · CS336 学习笔记';
        })
        .catch(function(err) {
          container.innerHTML = '<p>笔记加载失败（' + slug + '.md），请确认文件存在。</p>';
          console.error(err);
        });
    }
  </script>
</body>
</html>
